name: icicles_serial_protocol
description: >-
  Framed USB-serial protocol for icicles controllers: CRC-16 framing,
  garbage-tolerant frame parsing, device info and DisplayView payload
  encoding from icicles_animation_dart domain objects.
version: 0.2.2
publish_to: "none"

environment:
  sdk: ^3.5.3

dependencies:
  icicles_animation_dart:
    git:
      url: git@github.com:led-icicles/icicles_animation_dart.git
      ref: v3.1.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
